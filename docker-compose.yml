# CTV dbt+Iceberg PoC — single-VM stack. Reads variables from .env (same directory).
# AWS creds flow via the default provider chain (AWS_* env), so no keys live in config files.
services:
  nessie:
    image: ghcr.io/projectnessie/nessie:${NESSIE_VERSION}
    container_name: nessie
    # Run as root so RocksDB can write to the bind-mounted /nessie/data (the host dir is owned by
    # ec2-user; Nessie's default container user is non-root and hits "Permission denied" otherwise).
    user: root
    ports: ["19120:19120"]
    environment:
      # embedded RocksDB version store (no separate DB); path is on the EBS-backed volume
      nessie.version.store.type: ROCKSDB
      nessie.version.store.persist.rocks.database-path: /nessie/data
      # Iceberg REST catalog warehouse on S3 (used by PyIceberg via /iceberg/).
      # Validated against Nessie 0.104.1 (2026-07-22). See docs/runbooks/nessie/runbook.md §4.
      nessie.catalog.default-warehouse: warehouse
      nessie.catalog.warehouses.warehouse.location: ${WAREHOUSE}
      nessie.catalog.service.s3.default-options.region: ${AWS_REGION}
      # Nessie's Iceberg REST catalog accesses S3 itself (STATIC auth, the default). It does NOT
      # read the AWS_* env vars — creds must be handed to it via a Nessie "secret" URN. The
      # secret's .name/.secret are pulled from the AWS_* values in .env at compose-parse time.
      nessie.catalog.service.s3.default-options.access-key: urn:nessie-secret:quarkus:nessie.catalog.secrets.access-key
      nessie.catalog.secrets.access-key.name: ${AWS_ACCESS_KEY_ID}
      nessie.catalog.secrets.access-key.secret: ${AWS_SECRET_ACCESS_KEY}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
    volumes:
      - ${NESSIE_DATA_DIR}:/nessie/data
    restart: unless-stopped

  trino:
    image: trinodb/trino:${TRINO_VERSION}
    container_name: trino
    ports: ["8080:8080"]
    volumes:
      - ./infra/trino/catalog:/etc/trino/catalog:ro
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
      # Prod Postgres creds for the postgresql catalog (infra/trino/catalog/postgres.properties
      # reads these via ${ENV:...}; values come from .env, so no secrets in committed files).
      PG_HOST: ${PG_HOST}
      PG_PORT: ${PG_PORT}
      PG_DB: ${PG_DB}
      PG_USER: ${PG_USER}
      PG_PASSWORD: ${PG_PASSWORD}
      # Databricks Unity Catalog (Iceberg REST) — scratch unity_catalog.properties reads these via
      # ${ENV:...}; values come from .env (gitignored), so no secrets in committed files. Optional:
      # only needed while testing the UC interop catalog.
      DATABRICKS_HOST: ${DATABRICKS_HOST:-}
      UC_CATALOG: ${UC_CATALOG:-}
      DATABRICKS_TOKEN: ${DATABRICKS_TOKEN:-}
      # Explicit Azure storage-account key for the UC managed-table files (Trino 483 can't use UC
      # vended creds for ADLS — trinodb/trino #23238). Same key uc_reference_sync uses. Read by
      # unity_catalog.properties via ${ENV:UC_AZURE_STORAGE_ACCOUNT_KEY}.
      UC_AZURE_STORAGE_ACCOUNT_NAME: ${UC_AZURE_STORAGE_ACCOUNT_NAME:-}
      UC_AZURE_STORAGE_ACCOUNT_KEY: ${UC_AZURE_STORAGE_ACCOUNT_KEY:-}
      # Polaris principal creds for the catalog-PoC `polaris.properties` (reads ${ENV:POLARIS_OAUTH2_CREDENTIAL}).
      # Format "clientId:clientSecret" of the trino_poc principal from scripts/catalog/polaris/polaris_bootstrap.sh. In .env
      # (gitignored). Optional: only needed while the polaris catalog is wired.
      POLARIS_OAUTH2_CREDENTIAL: ${POLARIS_OAUTH2_CREDENTIAL:-}
      # Lakekeeper Iceberg REST URI for lakekeeper.properties (reads ${ENV:LAKEKEEPER_URI}). KEEP THIS INTERNAL
      # (default). Trino talks to Lakekeeper over the Docker network and ignores the public BASE_URI Lakekeeper
      # advertises. Do NOT set this to the public IP — the VM can't reach its own public 8282 (SG allows only
      # Databricks), so Trino would hang. Internal here + BASE_URI public above = Trino and Databricks both work.
      LAKEKEEPER_URI: ${LAKEKEEPER_URI:-http://lakekeeper:8181/catalog}
    depends_on: [nessie]
    restart: unless-stopped

  dbt:
    build: { context: ., dockerfile: infra/Dockerfile.dbt }
    container_name: dbt
    environment:
      DBT_PROFILES_DIR: /dbt
    volumes:
      - ./dbt:/dbt
    working_dir: /dbt
    depends_on: [trino]
    command: tail -f /dev/null
    restart: unless-stopped

  ingestion:
    build: { context: ., dockerfile: infra/Dockerfile.ingestion }
    container_name: ingestion
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
      S3_BUCKET: ${S3_BUCKET}
      WAREHOUSE: ${WAREHOUSE}
      NESSIE_ICEBERG_URI: ${NESSIE_ICEBERG_URI}
      AZURE_STORAGE_ACCOUNT_NAME: ${AZURE_STORAGE_ACCOUNT_NAME}
      AZURE_STORAGE_ACCOUNT_KEY: ${AZURE_STORAGE_ACCOUNT_KEY}
      # Unity Catalog reference sync (uc_reference_sync.py) — second storage account (base path is
      # hardcoded in the .py). UC_AZURE_STORAGE_ACCOUNT_NAME must match the account in that path.
      UC_AZURE_STORAGE_ACCOUNT_NAME: ${UC_AZURE_STORAGE_ACCOUNT_NAME:-}
      UC_AZURE_STORAGE_ACCOUNT_KEY: ${UC_AZURE_STORAGE_ACCOUNT_KEY:-}
      # Point the TLS stack (OpenSSL + libcurl) at the system CA bundle so DuckDB's Azure client can
      # verify TLS to blob storage. Needed for Delta tables with deletionVectors / v2Checkpoint,
      # which delta-rs can't read and only DuckDB can. ca-certificates is installed in the image.
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
      SSL_CERT_DIR: /etc/ssl/certs
      CURL_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
    volumes:
      - ./ingestion:/app/ingestion
    working_dir: /app
    depends_on: [nessie]
    command: tail -f /dev/null
    restart: unless-stopped

  # ===== Polaris parallel pipeline (side-by-side clone of dbt/ + ingestion/) =====
  # Same IMAGES as the Nessie dbt/ingestion services (no requirements change) — only the mounted
  # code folder + catalog binding differ. Run: `docker compose exec dbt_polaris dbt run ...` and
  # `docker compose exec ingestion_polaris python -m ingestion_polaris.<module>`. The Nessie services
  # above are untouched. See docs/runbooks/polaris/polaris_pipeline_runbook.md §2a.
  dbt_polaris:
    build: { context: ., dockerfile: infra/Dockerfile.dbt }   # reuse the Nessie dbt image
    container_name: dbt_polaris
    environment:
      DBT_PROFILES_DIR: /dbt_polaris
    volumes:
      - ./dbt_polaris:/dbt_polaris
    working_dir: /dbt_polaris
    depends_on: [trino]
    command: tail -f /dev/null
    restart: unless-stopped

  ingestion_polaris:
    build: { context: ., dockerfile: infra/Dockerfile.ingestion }   # reuse the Nessie ingestion image
    container_name: ingestion_polaris
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
      S3_BUCKET: ${S3_BUCKET}
      WAREHOUSE: ${WAREHOUSE}
      # Polaris Iceberg REST (OAuth2) — the catalog binding that differs from Nessie.
      POLARIS_ICEBERG_URI: ${POLARIS_ICEBERG_URI:-http://polaris:8181/api/catalog}
      POLARIS_WAREHOUSE: ${POLARIS_WAREHOUSE:-ctv_poc}
      POLARIS_OAUTH2_CREDENTIAL: ${POLARIS_OAUTH2_CREDENTIAL}
      POLARIS_SCOPE: ${POLARIS_SCOPE:-PRINCIPAL_ROLE:ALL}
      AZURE_STORAGE_ACCOUNT_NAME: ${AZURE_STORAGE_ACCOUNT_NAME}
      AZURE_STORAGE_ACCOUNT_KEY: ${AZURE_STORAGE_ACCOUNT_KEY}
      UC_AZURE_STORAGE_ACCOUNT_NAME: ${UC_AZURE_STORAGE_ACCOUNT_NAME:-}
      UC_AZURE_STORAGE_ACCOUNT_KEY: ${UC_AZURE_STORAGE_ACCOUNT_KEY:-}
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
      SSL_CERT_DIR: /etc/ssl/certs
      CURL_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
    volumes:
      - ./ingestion_polaris:/app/ingestion_polaris
    working_dir: /app
    depends_on: [polaris]
    command: tail -f /dev/null
    restart: unless-stopped

  # ===== Iceberg catalogs under evaluation — start with the stack =====
  # Candidates that may REPLACE Nessie for the whole pipeline if they meet the v3+VARIANT hard reqs, so they
  # live in the main compose (not a throwaway overlay). Trino reaches them by service name; there is deliberately
  # NO `depends_on` from trino -> these (Iceberg catalogs load lazily, and the pipeline must not hinge on a
  # candidate catalog being up). Metadata store = one Postgres, a DB per catalog. See docs/catalog/catalog_poc_runbook.md.
  # (Lakekeeper is added here in Part B once its config is finalized.)

  catalog_postgres:                              # metadata (pointer) store for Polaris + Lakekeeper
    image: postgres:16
    container_name: catalog_postgres
    environment:
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: ${CATALOG_PG_PASSWORD:-catalogpoc}
      POSTGRES_DB: polaris                       # `lakekeeper` DB created by the init script
    volumes:
      - catalog_pg_data:/var/lib/postgresql/data # named volume on the VM's (EBS-backed) docker storage
      - ./scripts/catalog/polaris/init-catalog-dbs.sql:/docker-entrypoint-initdb.d/init-catalog-dbs.sql:ro
    healthcheck:                                 # gate the bootstrap + Polaris on Postgres being ready
      test: ["CMD-SHELL", "pg_isready -U catalog -d polaris"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  polaris_bootstrap:                             # ONE-SHOT: create Polaris' schema + root principal, then exit.
    # Polaris 1.7 does NOT self-create its metastore schema on startup — the server just makes the root creds
    # AVAILABLE (POLARIS_BOOTSTRAP_CREDENTIALS). Without this step the first API call fails with
    # `relation "polaris_schema.entities" does not exist`. The admin tool is idempotent in 1.7 (re-runs skip),
    # so it's safe to run on every `up`. Same datasource env as the `polaris` service, pointed at the same DB.
    image: apache/polaris-admin-tool:${POLARIS_VERSION:-latest}
    container_name: polaris_bootstrap
    depends_on:
      catalog_postgres:
        condition: service_healthy
    environment:
      polaris.persistence.type: relational-jdbc
      quarkus.datasource.db-kind: postgresql
      quarkus.datasource.jdbc.url: jdbc:postgresql://catalog_postgres:5432/polaris
      quarkus.datasource.username: catalog
      quarkus.datasource.password: ${CATALOG_PG_PASSWORD:-catalogpoc}
    command: ["bootstrap", "-r", "POLARIS", "-c", "POLARIS,root,${POLARIS_ROOT_SECRET:-s3cr3t}"]
    restart: "no"                                # run once and exit; not a long-running service

  polaris:                                       # Apache Polaris — Iceberg REST catalog
    image: apache/polaris:${POLARIS_VERSION:-latest}   # server 1.7.0 via `latest`; admin-tool tag tracks this var
    container_name: polaris
    depends_on:
      catalog_postgres:
        condition: service_healthy
      polaris_bootstrap:
        condition: service_completed_successfully   # start only after the schema + root principal exist
    ports: ["8181:8181"]                         # Iceberg REST + management API
    environment:
      # persistence -> relational JDBC on the `polaris` DB (env NAMES are Polaris-version-specific; verify)
      polaris.persistence.type: relational-jdbc
      quarkus.datasource.db-kind: postgresql
      quarkus.datasource.jdbc.url: jdbc:postgresql://catalog_postgres:5432/polaris
      quarkus.datasource.username: catalog
      quarkus.datasource.password: ${CATALOG_PG_PASSWORD:-catalogpoc}
      POLARIS_BOOTSTRAP_CREDENTIALS: POLARIS,root,${POLARIS_ROOT_SECRET:-s3cr3t}
      # PoC storage auth: we have NO IAM role for Polaris to assume, so skip STS credential sub-scoping and let
      # Polaris use its own ambient AWS_* creds for FileIO (matches the pass-1 "own keys, no vending" design).
      # Without this, table create fails in sts:AssumeRole -> "Failed to create transaction". Production path
      # is the opposite: give the catalog a roleArn and turn ON real credential vending (pass 2).
      'polaris.features."SKIP_CREDENTIAL_SUBSCOPING_INDIRECTION"': "true"
      # Allow DROP TABLE/VIEW to purge S3 files. Trino's DROP sends purgeRequested=true; Polaris blocks purge
      # by DEFAULT (a guardrail against accidental data loss) -> 403 "Unable to purge entity". Enabling it gives
      # clean PoC teardown. NOTE: in production you may deliberately leave this OFF — then a DROP only removes
      # the catalog pointer and the S3 data survives for recovery.
      'polaris.features."DROP_WITH_PURGE_ENABLED"': "true"
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
    restart: unless-stopped

  lakekeeper_migrate:                            # ONE-SHOT: create/upgrade Lakekeeper's Postgres schema, then exit.
    # Lakekeeper needs `migrate` run against its DB before `serve` will start (analogous to Polaris' admin-tool
    # bootstrap). Idempotent — safe on every `up`. Uses the `lakekeeper` DB in the shared catalog_postgres.
    image: quay.io/lakekeeper/catalog:${LAKEKEEPER_VERSION:-latest}   # <-- VERIFY tag vs docs.lakekeeper.io
    container_name: lakekeeper_migrate
    depends_on:
      catalog_postgres:
        condition: service_healthy
    environment:
      LAKEKEEPER__PG_DATABASE_URL_READ:  postgres://catalog:${CATALOG_PG_PASSWORD:-catalogpoc}@catalog_postgres:5432/lakekeeper
      LAKEKEEPER__PG_DATABASE_URL_WRITE: postgres://catalog:${CATALOG_PG_PASSWORD:-catalogpoc}@catalog_postgres:5432/lakekeeper
      LAKEKEEPER__PG_ENCRYPTION_KEY: ${LAKEKEEPER_ENCRYPTION_KEY:-lakekeeper-poc-encryption-key}
    command: ["migrate"]
    restart: "no"

  lakekeeper:                                    # Lakekeeper — Iceberg REST catalog (Rust)
    image: quay.io/lakekeeper/catalog:${LAKEKEEPER_VERSION:-latest}
    container_name: lakekeeper
    depends_on:
      catalog_postgres:
        condition: service_healthy
      lakekeeper_migrate:
        condition: service_completed_successfully
    ports: ["8282:8181"]                         # host 8282 -> container 8181 (Polaris already owns host 8181)
    environment:
      LAKEKEEPER__PG_DATABASE_URL_READ:  postgres://catalog:${CATALOG_PG_PASSWORD:-catalogpoc}@catalog_postgres:5432/lakekeeper
      LAKEKEEPER__PG_DATABASE_URL_WRITE: postgres://catalog:${CATALOG_PG_PASSWORD:-catalogpoc}@catalog_postgres:5432/lakekeeper
      LAKEKEEPER__PG_ENCRYPTION_KEY: ${LAKEKEEPER_ENCRYPTION_KEY:-lakekeeper-poc-encryption-key}
      # Lakekeeper advertises this in GET /config. External Databricks (fresh connect) FOLLOWS it, so for
      # cross-cloud set LAKEKEEPER_BASE_URI in .env to the VM PUBLIC url (http://<VM_PUBLIC_IP>:8282). Trino does
      # NOT follow it — Trino keeps talking to its own configured LAKEKEEPER_URI (internal, below). So the stable
      # setup is: BASE_URI=public (for Databricks) + LAKEKEEPER_URI unset/internal (for Trino) -> BOTH work at
      # once, no toggling. Do NOT also point LAKEKEEPER_URI at the public IP: the VM can't reach its own public
      # 8282 (SG allows only Databricks' source), so Trino would hang.
      LAKEKEEPER__BASE_URI: ${LAKEKEEPER_BASE_URI:-http://lakekeeper:8181}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
    command: ["serve"]
    restart: unless-stopped

volumes:
  catalog_pg_data:
