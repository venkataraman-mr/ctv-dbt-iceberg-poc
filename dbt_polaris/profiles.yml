ctv_occurrence_polaris:
  target: dev
  outputs:
    dev:
      type: trino
      method: none          # no-auth Trino on the private VM
      user: dbt
      host: trino           # compose service name
      port: 8080
      database: polaris     # the Trino catalog (Polaris-backed) — the one change vs. dbt/profiles.yml
      schema: silver        # default; gold models override via +schema
      threads: 4
      http_scheme: http
