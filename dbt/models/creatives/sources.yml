version: 2
sources:
  # Prod Postgres `creatives` schema, read through the Trino `postgresql` catalog
  # (infra/trino/catalog/postgres.properties). This is the READ side for the Piece 4 sync-back
  # (creatives.creative -> iceberg.gold.creative, timestamp-watermarked).
  #
  # WRITES (Piece 3) do NOT go through these — new CTV creatives are pushed to CLONE tables via
  # psycopg2 cloned stored procs (creatives.sp_dbx_*), owned by the DBA/team. Column schemas are
  # resolved at query time from the live catalog, so they are intentionally not declared here.
  - name: creatives
    database: postgres          # Trino catalog name (not Iceberg)
    schema: creatives
    tables:
      - name: creative
      - name: creative_first_seen
      - name: creative_dedupe_map
      - name: component_coding
      - name: creative_classification_engine_holding

  # vx2 taxonomy dims (advertiser/product masters) — read straight from Postgres via the Trino
  # catalog. In Databricks these are MANAGED tables synced from Postgres (OmnisReferenceSync); we
  # skip that hop and read the Postgres source of truth directly. Used by the creative
  # component/translation flow. (If we later want them in Iceberg for read locality, a small dbt
  # model can CTAS them into iceberg.vx2_taxonomy.* — for now, direct read.)
  - name: vx2_taxonomy
    database: postgres          # Trino catalog name (not Iceberg)
    schema: vx2_taxonomy
    tables:
      - name: d_advertiser
      - name: d_product

  # Piece 4 sync-back READS the seeded tempwork *_ctv_poc CLONES (not real creatives.*), via the
  # Trino postgresql catalog. The *_forsync_tmp_* / *_hold_* / crtv_sync_* scratch are created at run
  # time by the cloned procs (ddl/postgres/nessie/piece4_sync_procs_ctv_poc.sql); declared here so models can
  # source() them. Writes back (CE-hold / advert-hold pushback) go via postgres.system.execute, not these.
  - name: tempwork
    database: postgres          # Trino catalog name (not Iceberg)
    schema: tempwork
    tables:
      - name: creative_forsync_tmp_ctv_poc                          # task 1 proc output
      - name: component_coding_forsync_tmp_ctv_poc                  # task 4 proc output
      - name: crtv_sync_to_db_updated_crtvs_with_holding_flag_ctv_poc # task 1 CE-hold source (proc scratch)
      - name: creative_first_seen_ctv_poc                           # task 2
      - name: creative_dedupe_map_ctv_poc                           # task 3
      - name: creative_ctv_poc                                      # task 3 delete pass
