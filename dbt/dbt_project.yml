name: 'ctv_occurrence'
version: '1.0.0'
profile: 'ctv_occurrence'
config-version: 2

model-paths: ["models"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

# Drop each job's scratch tables at end of a successful run — the analog of the Databricks jobwork DROP.
# Only fires if no model with that tag failed this run; a failed run keeps that tag's scratch for debugging.
# Opt out per job: dbt run ... --vars 'keep_<TAG>_tables: true'. Tags match the Databricks job names.
on-run-end:
  # RAW_OCCS_TO_CREATIVE_STAGING (Piece 3 Job A): drop the crtv_staging_* / crtv_autochaff* scratch.
  # Opt out: --vars 'keep_RAW_OCCS_TO_CREATIVE_STAGING_tables: true'.
  - "{{ cleanup_tagged_models(results, 'RAW_OCCS_TO_CREATIVE_STAGING') }}"
  # CREATIVE_FIRST_SEEN_AND_OCCS_SUMMARY (Piece 3 Job B): drop the crtv_firstseen / crtv_occ_summary_* scratch.
  # Opt out: --vars 'keep_CREATIVE_FIRST_SEEN_AND_OCCS_SUMMARY_tables: true'.
  - "{{ cleanup_tagged_models(results, 'CREATIVE_FIRST_SEEN_AND_OCCS_SUMMARY') }}"
  # SYNC_CREATIVES_TO_ICEBERG (Piece 4 sync-back): drop the bronze candidate/stage tables (crtv_sync_* /
  # comp_sync_* / crtv_product_resync_*). Opt out: --vars 'keep_SYNC_CREATIVES_TO_ICEBERG_tables: true'.
  - "{{ cleanup_tagged_models(results, 'SYNC_CREATIVES_TO_ICEBERG') }}"
  # DIGITAL_RAW_OCC_TO_GOLD_OCC (Piece 5 gold-occurrence): drop the bronze candidate/stage tables (digital_occ_*)
  # — the jobwork DROP analog. Opt out: --vars 'keep_DIGITAL_RAW_OCC_TO_GOLD_OCC_tables: true'.
  - "{{ cleanup_tagged_models(results, 'DIGITAL_RAW_OCC_TO_GOLD_OCC') }}"

models:
  ctv_occurrence:
    +materialized: view
    # The NATIVE Nessie connector (iceberg.catalog.type=nessie) does not support CREATE VIEW, and
    # dbt-trino's incremental materialization stages new rows in a temp relation — force it to a TABLE
    # (not a view) so it works on the native catalog. Applies catalog-wide. (Nessie's Iceberg REST
    # catalog does support views — validated via iceberg_rest on Trino 483 — but the pipeline runs on
    # the native catalog, so views stay disabled here.)
    +views_enabled: false
    bronze:
      +tags: ['bronze']          # bronze = sources only (Spark/PyIceberg owns the tables)
    reference:
      +tags: ['reference']       # synced reference tables (Option C), declared as sources
    silver:
      +materialized: incremental
      +tags: ['silver']
    gold:
      +materialized: table
      +tags: ['gold']
