name: 'ctv_occurrence'
version: '1.0.0'
profile: 'ctv_occurrence'
config-version: 2

model-paths: ["models"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

# Drop each job's scratch tables (models tagged job_a / job_b) at end of a successful run — the analog
# of the Databricks jobwork DROP. Only fires if no model with that tag failed this run; a failed run
# keeps that tag's scratch for debugging. Opt out: dbt run ... --vars 'keep_job_a_tables: true' (or
# keep_job_b_tables).
on-run-end:
  - "{{ cleanup_tagged_models(results, 'job_a') }}"
  - "{{ cleanup_tagged_models(results, 'job_b') }}"
  # Piece-4 sync-back scratch cleanup: drop the bronze candidate/stage tables (crtv_sync_* / comp_sync_* /
  # crtv_product_resync_*) at the end of a successful run — the analog of the Databricks jobwork DROP. Only
  # fires if no model with that tag failed this run. Opt out: --vars 'keep_p4_sync_creative_to_iceberg_tables: true'.
  - "{{ cleanup_tagged_models(results, 'p4_sync_creative_to_iceberg') }}"

models:
  ctv_occurrence:
    +materialized: view
    # The Nessie Iceberg catalog does not support CREATE VIEW. dbt-trino's incremental
    # materialization stages new rows in a temp relation — force it to a TABLE (not a view) so it
    # works on Nessie. Applies catalog-wide (every model here runs on the Iceberg/Nessie catalog).
    +views_enabled: false
    bronze:
      +tags: ['bronze']          # bronze = sources only (Spark/PyIceberg owns the tables)
    reference:
      +tags: ['reference']       # synced reference tables (Option C), declared as sources
    silver:
      +materialized: incremental
      +tags: ['silver']
    gold:
      +materialized: table
      +tags: ['gold']
