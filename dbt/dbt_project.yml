name: 'ctv_occurrence'
version: '1.0.0'
profile: 'ctv_occurrence'
config-version: 2

model-paths: ["models"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

# Drop the Job A scratch tables (models tagged 'job_a') at end of a successful run — the analog of the
# Databricks jobwork DROP. Only fires when crtv_staging_final succeeded; a failed run keeps them for
# debugging. Opt out to inspect them: dbt run ... --vars 'keep_job_a_tables: true'
on-run-end:
  - "{{ cleanup_tagged_models(results, 'job_a', 'crtv_staging_final') }}"

models:
  ctv_occurrence:
    +materialized: view
    # The Nessie Iceberg catalog does not support CREATE VIEW. dbt-trino's incremental
    # materialization stages new rows in a temp relation — force it to a TABLE (not a view) so it
    # works on Nessie. Applies catalog-wide (every model here runs on the Iceberg/Nessie catalog).
    +views_enabled: false
    bronze:
      +tags: ['bronze']          # bronze = sources only (Spark/PyIceberg owns the tables)
    reference:
      +tags: ['reference']       # synced reference tables (Option C), declared as sources
    silver:
      +materialized: incremental
      +tags: ['silver']
    gold:
      +materialized: table
      +tags: ['gold']
