# Trino -> Nessie (native catalog) -> Iceberg on S3.
# No OAuth: Nessie runs auth-disabled on the private VM. AWS creds via env (default chain).
connector.name=iceberg
iceberg.catalog.type=nessie
iceberg.nessie-catalog.uri=http://nessie:19120/api/v2
iceberg.nessie-catalog.ref=main
iceberg.nessie-catalog.default-warehouse-dir=s3://dataplatformpoc-venketa/warehouse
fs.native-s3.enabled=true
s3.region=us-east-2
# Table S3 directory naming (applies to EVERY Trino Iceberg catalog — it's a connector default, not catalog-
# specific). Trino defaults iceberg.unique-table-location=true, appending a random UUID suffix to each new
# table's S3 path (e.g. .../mytable-3fbf2aae...). Safety measure: a recreated table never reuses a dropped
# table's prefix (avoids reading orphaned files). Other engines (Databricks) write the clean catalog location
# (.../mytable). To make Trino match, uncomment the next line and restart Trino. Left OFF (default true) for now
# — the suffix is the safer choice, especially with drop+recreate cycles.
#   iceberg.unique-table-location=false
# For the reference/creative tables whose DATA sits on Azure ADLS, additionally enable:
#   fs.native-azure.enabled=true
#   azure.auth-type=... (account key / OAuth)
