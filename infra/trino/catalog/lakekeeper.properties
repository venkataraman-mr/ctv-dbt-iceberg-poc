# Trino catalog: connect Trino -> Lakekeeper (Iceberg REST) for the catalog PoC.
# Drop into infra/trino/catalog/ as `lakekeeper.properties`, then `docker compose up -d trino`.
# Wire this only AFTER scripts/catalog/lakekeeper/lakekeeper_bootstrap.sh has created the `ctv_lakekeeper` warehouse.

connector.name=iceberg
iceberg.catalog.type=rest

# Lakekeeper Iceberg REST endpoint. Read from ${ENV:LAKEKEEPER_URI} (set in docker-compose trino env, overridable
# via .env). This MUST match the host in LAKEKEEPER__BASE_URI, because Lakekeeper advertises BASE_URI in
# GET /config and the client follows it. Default internal http://lakekeeper:8181/catalog; for the cross-cloud
# test set both LAKEKEEPER_URI and LAKEKEEPER_BASE_URI to the VM public URL so Trino + Databricks use one address.
iceberg.rest-catalog.uri=${ENV:LAKEKEEPER_URI}

# The Lakekeeper warehouse name created at bootstrap (the REST "warehouse").
iceberg.rest-catalog.warehouse=ctv_lakekeeper

# Unsecured Lakekeeper (no OpenID in this PoC): send a static bearer token; any value is accepted.
# If we later enable OpenID auth, switch to oauth2.credential + a token endpoint like the Polaris catalog.
iceberg.rest-catalog.security=OAUTH2
iceberg.rest-catalog.oauth2.token=dummy

# STORAGE (own keys): Lakekeeper with access-key + STS off uses S3 *remote signing*, which Trino 483 does not
# consume (it looks for vended keys and fails with "accessKey is null"). So Trino reaches S3 with its OWN creds
# (AWS_* env already in the container, default provider chain), same as the Nessie `iceberg` and Polaris catalogs.
# Lakekeeper still owns the metadata pointer; only the raw S3 IO is done by Trino directly.
fs.native-s3.enabled=true
s3.region=us-east-2

# Table S3 directory naming: Trino defaults iceberg.unique-table-location=true, which appends a random UUID
# suffix to each new table's S3 path (.../mytable-<uuid>). Safety measure — a recreated table never reuses a
# dropped table's prefix. Databricks-created tables use the clean location (.../mytable). Uncomment to make
# Trino write clean paths too (then restart Trino). Left OFF (default true) for now — suffix is safer.
#   iceberg.unique-table-location=false

# To instead test Lakekeeper credential vending, you'd need STS (a warehouse sts-role-arn / IAM role) and then:
# iceberg.rest-catalog.vended-credentials-enabled=true   (not viable in this PoC — no role)
