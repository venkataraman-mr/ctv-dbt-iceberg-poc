# SCRATCH catalog: Trino -> Nessie via the Iceberg REST API (side-by-side with the native `iceberg`
# catalog). Purpose: validate that CREATE VIEW works on the REST path before switching the main
# catalog over. Same Nessie server, same `main` branch, same S3 warehouse -> identical tables as
# `iceberg`, just reached over REST (/iceberg/) instead of the native Nessie API (/api/v2).
# Safe to add and remove; it does not touch the working `iceberg` catalog.
connector.name=iceberg
iceberg.catalog.type=rest

# Nessie's Iceberg REST endpoint (note: /iceberg/, NOT /api/v2).
iceberg.rest-catalog.uri=http://nessie:19120/iceberg/

# The Nessie warehouse NAME (from the Nessie server config: nessie.catalog.default-warehouse=warehouse),
# not the s3:// path.
iceberg.rest-catalog.warehouse=warehouse

# Nessie addresses the branch/ref via the REST prefix. If the catalog errors on load or shows no
# schemas, this is the first thing to adjust (see troubleshooting notes in chat).
iceberg.rest-catalog.prefix=main

# Auth is off on the private VM (same as the native catalog).
iceberg.rest-catalog.security=NONE

# Trino reaches S3 with its own native filesystem, using the AWS_* env already passed to the
# container (same creds the working `iceberg` catalog uses).
fs.native-s3.enabled=true
s3.region=us-east-2

# Fallback if S3 reads fail because Nessie is vending storage config/credentials instead:
#   iceberg.rest-catalog.vended-credentials-enabled=true
#   (and you may then drop the fs.native-s3 lines). Try the native-S3 form above first.
