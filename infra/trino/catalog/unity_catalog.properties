# SCRATCH catalog: Trino -> Databricks Unity Catalog via the Iceberg REST Catalog API (IRC).
# Purpose: validate read + write on UC-managed Iceberg tables from our external Trino/dbt engine,
# using UC credential vending for the Azure (ADLS) storage. Side-by-side with `iceberg` (Nessie);
# does not touch the pipeline. Requires the Databricks-side access in docs/catalog/uc_iceberg_rest_access_request.md.
#
# Values come from .env (gitignored) via ${ENV:...} — no secrets in this committed file:
#   DATABRICKS_HOST   = full workspace URL incl. workspace id, e.g. https://adb-<id>.<n>.azuredatabricks.net
#   UC_CATALOG        = the Unity Catalog catalog name to target (the REST "warehouse")
#   DATABRICKS_TOKEN  = a PAT or service-principal OAuth token for a principal that has
#                       USE CATALOG + USE SCHEMA + EXTERNAL USE SCHEMA (+ SELECT/MODIFY) on the test schema
connector.name=iceberg
iceberg.catalog.type=rest

# UC Iceberg REST endpoint. Databricks DEPRECATED /api/2.1/unity-catalog/iceberg in favor of
# /api/2.1/unity-catalog/iceberg-rest (error "Legacy Iceberg endpoints ... are deprecated. Please
# migrate to ... /iceberg-rest/v1/" = you're on the old suffix). The workspace URL MUST include the
# workspace id, else requests 303-redirect to a login page.
iceberg.rest-catalog.uri=${ENV:DATABRICKS_HOST}/api/2.1/unity-catalog/iceberg-rest

# The UC catalog name (top-level) -> Trino sees it as unity_catalog.<uc_schema>.<uc_table>.
iceberg.rest-catalog.warehouse=${ENV:UC_CATALOG}

# Static bearer token (PAT / SP token). Per-user OAuth passthrough is a known Trino gap, but a
# service token is exactly what we want for this test.
iceberg.rest-catalog.security=OAUTH2
iceberg.rest-catalog.oauth2.token=${ENV:DATABRICKS_TOKEN}

# Vended credentials DISABLED. Trino 483 implements Iceberg-REST vended credentials for S3 ONLY, not
# Azure ADLS (trinodb/trino #23238, still open). With vending on, UC returns a per-table SAS token but
# Trino ignores the adls.sas-token.* config and falls back to DefaultAzureCredential — which on this
# AWS EC2 VM has no AZURE_CLIENT_ID / no IMDS, so the file read fails with "Error processing metadata".
# Until #23238 lands, we authenticate the Azure filesystem with an explicit storage-account key.
iceberg.rest-catalog.vended-credentials-enabled=false

# Trino's native Azure filesystem (fs.azure.enabled replaced the older fs.native-azure.enabled in 483),
# authenticated with a static storage-account KEY — the SAME account/key uc_reference_sync already uses
# (UC_AZURE_STORAGE_ACCOUNT_KEY in .env, gitignored, so no secret in this committed file). This works
# ONLY if the tempwork managed table lives in that same storage account; a different account -> 403.
fs.azure.enabled=true
azure.auth-type=ACCESS_KEY
azure.access-key=${ENV:UC_AZURE_STORAGE_ACCOUNT_KEY}
