# SCRATCH catalog: Trino -> Databricks Unity Catalog via the Iceberg REST Catalog API (IRC).
# Purpose: validate read + write on UC-managed Iceberg tables from our external Trino/dbt engine,
# using UC credential vending for the Azure (ADLS) storage. Side-by-side with `iceberg` (Nessie);
# does not touch the pipeline. Requires the Databricks-side access in docs/uc_iceberg_rest_access_request.md.
#
# Values come from .env (gitignored) via ${ENV:...} — no secrets in this committed file:
#   DATABRICKS_HOST   = full workspace URL incl. workspace id, e.g. https://adb-<id>.<n>.azuredatabricks.net
#   UC_CATALOG        = the Unity Catalog catalog name to target (the REST "warehouse")
#   DATABRICKS_TOKEN  = a PAT or service-principal OAuth token for a principal that has
#                       USE CATALOG + USE SCHEMA + EXTERNAL USE SCHEMA (+ SELECT/MODIFY) on the test schema
connector.name=iceberg
iceberg.catalog.type=rest

# UC Iceberg REST endpoint. The workspace URL MUST include the workspace id, else requests get a
# 303 redirect to a login page. (If your workspace exposes /iceberg-rest instead, swap the suffix.)
iceberg.rest-catalog.uri=${ENV:DATABRICKS_HOST}/api/2.1/unity-catalog/iceberg

# The UC catalog name (top-level) -> Trino sees it as unity_catalog.<uc_schema>.<uc_table>.
iceberg.rest-catalog.warehouse=${ENV:UC_CATALOG}

# Static bearer token (PAT / SP token). Per-user OAuth passthrough is a known Trino gap, but a
# service token is exactly what we want for this test.
iceberg.rest-catalog.security=OAUTH2
iceberg.rest-catalog.oauth2.token=${ENV:DATABRICKS_TOKEN}

# UC vends short-lived Azure (ADLS) storage credentials per table. This is what lets our AWS-hosted
# Trino read/write the Azure data files. (Azure vended-cred support is newer in Trino — this is the
# main thing we're validating on Trino 483.)
iceberg.rest-catalog.vended-credentials-enabled=true

# Enable Trino's native Azure filesystem so it can USE the vended ADLS credentials. No static Azure
# keys needed here — the credentials come from UC per table.
fs.native-azure.enabled=true
