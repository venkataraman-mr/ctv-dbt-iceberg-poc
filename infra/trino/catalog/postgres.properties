# Trino -> prod Postgres (vxcentral). Read path for the creative sync-back (Piece 4); writes go via
# psycopg2 cloned stored procs, not Trino. Reachability was BLOCKED (cross-cloud) until DevOps opened
# the path — verified with scripts/pg_connectivity_test.sh.
#
# Credentials come from ENV (${ENV:...}) so no secrets live in this committed file. The trino service
# in docker-compose.yml passes PG_HOST/PG_PORT/PG_DB/PG_USER/PG_PASSWORD from .env (gitignored).
connector.name=postgresql
# ApplicationName labels every Trino->Postgres connection in pg_stat_activity.application_name, so
# the DBA can attribute connections even while we share the databricks_admin_user login. (Add TLS or
# other params with & , e.g. ...?ApplicationName=trino-ctv-poc&sslmode=require)
connection-url=jdbc:postgresql://${ENV:PG_HOST}:${ENV:PG_PORT}/${ENV:PG_DB}?ApplicationName=trino-ctv-poc
connection-user=${ENV:PG_USER}
connection-password=${ENV:PG_PASSWORD}
# Map Postgres mixed-case identifiers safely.
case-insensitive-name-matching=true
# Bound metadata churn: cache schema/table name lookups so the connector doesn't re-query the
# catalog on every statement (also keeps case-insensitive-name-matching from refreshing constantly).
case-insensitive-name-matching.cache-ttl=30m
metadata.cache-ttl=30m
metadata.cache-missing=true
