# Trino -> prod Postgres (vxcentral). Read path for the creative sync-back (Piece 4); writes go via
# psycopg2 cloned stored procs, not Trino. Reachability was BLOCKED (cross-cloud) until DevOps opened
# the path — verified with scripts/pg_connectivity_test.sh.
#
# Credentials come from ENV (${ENV:...}) so no secrets live in this committed file. The trino service
# in docker-compose.yml passes PG_HOST/PG_PORT/PG_DB/PG_USER/PG_PASSWORD from .env (gitignored).
connector.name=postgresql
connection-url=jdbc:postgresql://${ENV:PG_HOST}:${ENV:PG_PORT}/${ENV:PG_DB}
connection-user=${ENV:PG_USER}
connection-password=${ENV:PG_PASSWORD}
# Map Postgres mixed-case identifiers safely.
case-insensitive-name-matching=true
